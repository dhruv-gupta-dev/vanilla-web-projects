<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="game">
        <h1>Tic-Tac-Toe</h1>

        <p id = "status" role = "status" aria-live="polite">Player X's Turn</p>


        <div class  = "board" id = "board" role="grid" aria-label="Tic-Tac-Toe game" >
            <button class = "btn" role="gridcell" data-index="0" aria-label = "Cell 1"></button>
            <button class = "btn" role="gridcell" data-index="1" aria-label = "Cell 2"></button>
            <button class = "btn" role="gridcell" data-index="2" aria-label = "Cell 3"></button>
            <button class = "btn" role="gridcell" data-index="3" aria-label = "Cell 4"></button>
            <button class = "btn" role="gridcell" data-index="4" aria-label = "Cell 5"></button>
            <button class = "btn" role="gridcell" data-index="5" aria-label = "Cell 6"></button>
            <button class = "btn" role="gridcell" data-index="6" aria-label = "Cell 7"></button>
            <button class = "btn" role="gridcell" data-index="7" aria-label = "Cell 8"></button>
            <button class = "btn" role="gridcell" data-index="8" aria-label = "Cell 9"></button>
        </div>

        <button class ="reset-btn" id = "reset_btn">Restart Game</button>
    </main>
    <script src="app.js"></script>
</body>
</html>
